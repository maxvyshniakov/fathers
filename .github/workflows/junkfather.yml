name: junkfather

on:
  push:
    branches: [main]
    paths:
      - 'junkfather/**'
      - 'common/**'
      - '.github/workflows/junkfather.yml'
  pull_request:
    paths:
      - 'junkfather/**'
      - 'common/**'
      - '.github/workflows/junkfather.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junkfather-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: junkfather

jobs:
  gate:
    name: junkfather (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv (tools/check.py runs Ruff and Pyright through uvx)
        run: python -m pip install uv==0.13.5
      - name: Check Ruff and Pyright
        run: python tools/check.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
