name: junkfather

# package.yml tests both Python versions on Ubuntu and runs lint on the newest.
on:
  push:
    branches: [main]
    paths:
      - 'junkfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - 'tools/checks.py'
      - '.github/workflows/junkfather.yml'
      - '.github/workflows/package.yml'
  pull_request:
    paths:
      - 'junkfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - 'tools/checks.py'
      - '.github/workflows/junkfather.yml'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junkfather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/package.yml
    with:
      package: junkfather
      floor: '3.11'
