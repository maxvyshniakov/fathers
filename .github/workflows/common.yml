name: common

# package.yml tests both Python versions on Ubuntu and runs lint on the newest.
on:
  push:
    branches: [main]
    paths:
      - 'common/**'
      - 'install.py'
      - 'tools/checks.py'
      - '*/CHANGELOG.md'
      - '*/pyproject.toml'
      - '*/src/*/version.py'
      - '*/*/__init__.py'
      - '.github/workflows/common.yml'
      - '.github/workflows/package.yml'
  pull_request:
    paths:
      - 'common/**'
      - 'install.py'
      - 'tools/checks.py'
      - '*/CHANGELOG.md'
      - '*/pyproject.toml'
      - '*/src/*/version.py'
      - '*/*/__init__.py'
      - '.github/workflows/common.yml'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/package.yml
    with:
      package: common
      floor: '3.11'
