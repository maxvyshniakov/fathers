name: common

# The shared shape: package.yml runs the lint gate and the tests on the floor and the newest Python, on Ubuntu and
# macOS (fathers#120).
on:
  push:
    branches: [main]
    paths:
      - 'common/**'
      - 'install.py'
      - 'tools/checks.py'
      - '.github/workflows/common.yml'
      - '.github/workflows/package.yml'
  pull_request:
    paths:
      - 'common/**'
      - 'install.py'
      - 'tools/checks.py'
      - '.github/workflows/common.yml'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/package.yml
    with:
      package: common
      floor: '3.9'
