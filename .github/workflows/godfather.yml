name: godfather

on:
  push:
    branches: [main]
    paths:
      - 'godfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - 'slotfather/slotfather'
      - 'slotfather/src/**'
      - '.github/workflows/godfather.yml'
  pull_request:
    paths:
      - 'godfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - 'slotfather/slotfather'
      - 'slotfather/src/**'
      - '.github/workflows/godfather.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godfather-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: godfather

jobs:
  gate:
    name: godfather (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
        # actions/setup-python has no 3.9 build for the newest Ubuntu image; 24.04 still has one.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development tools
        if: matrix.python == '3.12'
        run: python -m pip install -r requirements-dev.txt
      - name: Check Ruff and strict Pyright budgets
        if: matrix.python == '3.12'
        run: python tools/check.py
      - name: Run unit, live and contract tests (the contract tests run ../slotfather)
        run: python -m unittest discover -s tests -t tests -v
