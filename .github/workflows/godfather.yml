name: godfather

# The shared shape: package.yml runs the lint gate and the tests on the floor and the newest Python, on Ubuntu and
# macOS (fathers#120).
on:
  push:
    branches: [main]
    paths:
      - 'godfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - 'slotfather/slotfather'
      - 'slotfather/src/**'
      - 'tools/checks.py'
      - '.github/workflows/godfather.yml'
      - '.github/workflows/package.yml'
  pull_request:
    paths:
      - 'godfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - 'slotfather/slotfather'
      - 'slotfather/src/**'
      - 'tools/checks.py'
      - '.github/workflows/godfather.yml'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godfather-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/package.yml
    with:
      package: godfather
      floor: '3.9'
