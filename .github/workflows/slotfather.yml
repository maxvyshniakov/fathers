name: slotfather

on:
  push:
    branches: [main]
    paths:
      - 'slotfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - '.github/workflows/slotfather.yml'
  pull_request:
    paths:
      - 'slotfather/**'
      - 'common/**'
      - 'tools/ruff.toml'
      - '.github/workflows/slotfather.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slotfather-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: slotfather

jobs:
  gate:
    name: slotfather (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Ruff and strict Pyright budgets
        run: python slotfather run -n 1 -- python tools/check.py
      - name: Run unit and integration tests
        run: python slotfather run -n 1 -- python -m unittest discover -s tests -v
