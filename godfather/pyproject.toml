[project]
name = "godfather"
version = "0.1.0"  # the newest release in CHANGELOG.md; src/godfather/version.py VERSION matches it
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 120
extend-include = ["godfather"]
exclude = [".git", "__pycache__", ".venv", "assets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests put src/ on sys.path (helpers) before importing the package
