# lanefather is standard library only and installs without a build step (install.py); this file only configures the
# checks that tools/check.py runs: ruff and pyright strict, against a baseline that only shrinks.
[project]
name = "lanefather"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
# tests/vendor holds files copied unchanged from other repositories (eventcheck.py: Godfather's validator).
extend-exclude = ["tests/fixtures", "tests/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # long commands are one story each; numbers are named in prose
    "PLW0603",  # the run's config is one module global
    "PLC0415",  # imports inside functions break the command modules' import cycle
    "PLR0917",  # positional arguments follow the old tools/lane signatures
    "PLW1510",  # every subprocess.run reads its returncode itself
    "RUF005",
    "SIM108",
    "RUF001", "RUF002", "RUF003",  # prose uses the multiplication sign and arrows
]

[tool.ruff.lint.per-file-ignores]
# The command tests came over from Straylight's tools/test-lane.py (#648) with their long assertion lines.
"tests/*" = ["E501", "RUF012", "B905", "PLW0108"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pyright]
include = ["lanefather", "tests", "install.py", "tools"]
exclude = ["tests/fixtures", "tests/vendor"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
